<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Farenheight to Celsius</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <script
      defer
      src="main.js"
    ></script>
  </head>
  <body>
    <h1>Fahrenheiht to Celsius Converter</h1>
    <hr />
    <p id="equation">°C = (°F - 32) x 5 / 9</p>
    <h2>Input</h2>
    <p id="construction"></p>
    <p id="p-input">
      Temperature in
      <span id="units-in"
        >Fahrenheiht:<input
          id="temp-in"
          type="number"
      /></span>
    </p>
    <button id="btn">CONVERT</button>
    <h2>Output</h2>
    <p id="imgs2"></p>
    <p id="p-output">
      Temperature in <span id="units-out">Celsius:</span>
      <span id="Output">----</span>.
    </p>
    <p id="imgs"></p>
    <hr />
    <p>
      Manadory link to
      <a
        id="link"
        target="_blank"
        href="https://en.wikipedia.org/wiki/Temperature"
        >Temperature</a
      >
    </p>
    <button id="other-btn">Calculate Celsius to Fahrenheiht</button>
  </body>
</html>
